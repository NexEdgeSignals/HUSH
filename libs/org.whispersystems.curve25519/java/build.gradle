apply plugin: 'java-library'

// Vendored from https://github.com/signalapp/curve25519-java @ 70fae57d6dccff7e78a46203c534314b07dfdd98 (version 0.5.0)
// Only build wiring modernized for the SilenceNG Gradle/AGP setup; source files are untouched.

group            = group_info
version          = '0.5.0'
archivesBaseName = "curve25519-java"

// upstream targets Java 7; also required for Gradle variant matching against libsignal's :java module (sourceCompatibility 1.7)
sourceCompatibility = 1.7
targetCompatibility = 1.7

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../common/src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java', '../tests/src/main/java']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:3.8.2'
    testImplementation 'org.easytesting:fest-assert:1.4'
}

test {
    useJUnit()
    testLogging {
        events 'passed'
    }
}
